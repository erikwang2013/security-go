<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" role="img" aria-label="哨兵鼠 · Sentinel Gopher — 告警 / alarmed">
  <title>哨兵鼠 · Sentinel Gopher — 告警 / alarmed</title>
  <desc>security-go 项目宠物的告警形态：检测到高危或严重命中，盾徽、雷达与放大镜转为红色并亮起告警环。</desc>

  <defs>
    <linearGradient id="p-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#45cdec"/>
      <stop offset="0.55" stop-color="#00add8"/>
      <stop offset="1" stop-color="#0891b4"/>
    </linearGradient>
    <linearGradient id="p-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22385f"/>
      <stop offset="1" stop-color="#121e35"/>
    </linearGradient>
    <linearGradient id="p-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#274271"/>
      <stop offset="1" stop-color="#15223b"/>
    </linearGradient>
    <radialGradient id="p-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e5484d" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#e5484d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#152740" stroke-width="1"/>
    </pattern>
    <clipPath id="p-card"><rect width="320" height="400" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#p-card)">
    <rect width="320" height="400" fill="#0b1220"/>
    <rect width="320" height="400" fill="url(#p-grid)"/>

    <!-- 巡检雷达弧 -->
    <g fill="none" stroke="#e5484d" stroke-opacity="0.13" stroke-dasharray="6 10">
      <circle cx="160" cy="212" r="118" stroke-width="1.5"/>
      <circle cx="160" cy="212" r="150" stroke-width="1.5"/>
      <circle cx="160" cy="212" r="182" stroke-width="1.5"/>
    </g>

    <circle cx="160" cy="210" r="150" fill="url(#p-glow)"/>

    <!-- 地面投影 -->
    <ellipse cx="160" cy="304" rx="86" ry="12" fill="#000" opacity="0.35"/>

    <!-- 耳朵 -->
    <g fill="#00a3cc" stroke="#067d9c" stroke-width="2">
      <circle cx="86" cy="178" r="16"/>
      <circle cx="234" cy="178" r="16"/>
    </g>
    <g fill="#7fd8ee">
      <circle cx="85" cy="180" r="7.5"/>
      <circle cx="235" cy="180" r="7.5"/>
    </g>

    <!-- 身体 -->
    <path d="M160 296C104 296 80 264 80 226C80 166 110 126 160 126C210 126 240 166 240 226C240 264 216 296 160 296Z"
          fill="url(#p-body)" stroke="#067d9c" stroke-width="3"/>

    <!-- 警帽 -->
    <path d="M100 128C100 78 124 58 160 58C196 58 220 78 220 128Z"
          fill="url(#p-cap)" stroke="#31517f" stroke-width="2.5"/>
    <rect x="92" y="118" width="136" height="15" rx="7.5" fill="#16233d" stroke="#31517f" stroke-width="2"/>
    <path d="M84 133C84 127 96 123 160 123C224 123 236 127 236 133C236 143 210 147 160 147C110 147 84 143 84 133Z"
          fill="#0f1b30" stroke="#31517f" stroke-width="2"/>
    <circle cx="160" cy="92" r="15" fill="#f5a623" stroke="#b8791a" stroke-width="2"/>
    <path d="M160 83.5L169 87v7c0 6-3.8 10-9 12-5.2-2-9-6-9-12v-7Z" fill="#16233d"/>

    <!-- 眼睛 -->
    <g fill="#ffffff" stroke="#067d9c" stroke-width="2">
      <ellipse cx="138" cy="186" rx="18" ry="20"/>
      <ellipse cx="182" cy="186" rx="18" ry="20"/>
    </g>
    <circle cx="141" cy="190" r="8.5" fill="#0b1220"/>
    <circle cx="185" cy="190" r="8.5" fill="#0b1220"/>
    <circle cx="138.5" cy="186.5" r="3" fill="#ffffff"/>
    <circle cx="182.5" cy="186.5" r="3" fill="#ffffff"/>

    <!-- 吻部与门牙 -->
    <ellipse cx="160" cy="233" rx="38" ry="25" fill="#7fd8ee" stroke="#0a9ec4" stroke-width="2"/>
    <ellipse cx="160" cy="220" rx="7" ry="5.5" fill="#0b1220"/>
    <g fill="#ffffff" stroke="#a9d3e2" stroke-width="2">
      <rect x="145" y="240" width="13" height="18" rx="3"/>
      <rect x="162" y="240" width="13" height="18" rx="3"/>
    </g>

    <!-- 左臂持盾 -->
    <circle cx="126" cy="256" r="14" fill="#00a3cc" stroke="#067d9c" stroke-width="2.5"/>
    <g>
      <path d="M84 202L115 213.5V244C115 266 101 282 84 291C67 282 53 266 53 244V213.5Z"
            fill="url(#p-shield)" stroke="#3a5c93" stroke-width="3"/>
      <path d="M84 210L108 219.4V244C108 261.5 97 274.5 84 282C71 274.5 60 261.5 60 244V219.4Z"
            fill="none" stroke="#e5484d" stroke-opacity="0.45" stroke-width="1.5"/>
      <ellipse cx="84" cy="237" rx="15" ry="10" fill="none" stroke="#e5484d" stroke-width="2.5"/>
      <circle cx="84" cy="237" r="5" fill="#e5484d"/>
      <text x="84" y="278" text-anchor="middle" font-size="21" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ff8b8f">36</text>
    </g>

    <!-- 右臂执放大镜 -->
    <path d="M226 240C246 233 257 217 261 200" fill="none" stroke="#00a3cc" stroke-width="17" stroke-linecap="round"/>
    <path d="M226 240C246 233 257 217 261 200" fill="none" stroke="#067d9c" stroke-width="20" stroke-linecap="round" stroke-opacity="0.25"/>
    <line x1="271" y1="176" x2="265" y2="189" stroke="#2b4470" stroke-width="9" stroke-linecap="round"/>
    <circle cx="264" cy="194" r="14" fill="#00a3cc" stroke="#067d9c" stroke-width="2.5"/>
    <circle cx="282" cy="150" r="23" fill="#e5484d" fill-opacity="0.12" stroke="#e5484d" stroke-width="7"/>
    <circle cx="282" cy="150" r="11" fill="#e5484d" fill-opacity="0.20"/>
    <circle cx="282" cy="150" r="5.5" fill="#e5484d" stroke="#ff8b8f" stroke-width="1.5"/>
    <circle cx="282" cy="150" r="33" fill="none" stroke="#e5484d" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="5 6"/>
    <path d="M271 137A15 15 0 0 1 283 134" fill="none" stroke="#cdf2ff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>

    <!-- 铭牌 -->
    <rect x="112" y="314" width="96" height="1.5" fill="#22406b"/>
    <text x="160" y="344" text-anchor="middle" font-size="18" font-weight="700" fill="#e6edf3"
          font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">哨兵鼠</text>
    <text x="160" y="364" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#93a3b8"
          font-family="system-ui, -apple-system, sans-serif">SENTINEL GOPHER</text>
    <text x="160" y="384" text-anchor="middle" font-size="11.5" fill="#e5484d"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">security-go · 36 detectors</text>
  </g>
</svg>
